<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment the Wave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="session-controls">
        <button id="joinSession">Join Session</button>
        <div id="peopleCount">People: 0</div>
    </div>

    <div class="app-container">
        <h1>Comment the Wave</h1>
        <div class="controls">
            <label for="fileInput" class="custom-file-upload">
                Choose Audio File

            <input type="file" id="fileInput" accept="audio/*" />
            </label>
            <input type="text" id="audioUrl" placeholder="Or enter audio URL" />
            <button id="loadUrl">Load URL</button>
            <button id="playPause">Play</button>
            <button id="exportComments">Export Comments</button>
        </div>
      <div id="waveform">
          <div id="middleTime">00:00:000</div>
          <div id="hover"></div>
      </div>
      <div id="commentsList"></div>

      <!-- Modal for comments -->
      <div id="commentModal" class="modal">
          <div class="modal-content">
              <h2>Add Comment</h2>
              <textarea id="commentText" placeholder="Your comment"></textarea>
              <button id="submitComment">ADD COMMENT</button>
          </div>
      </div>

     </div>

     <!-- Loading overlay -->
     <div id="loadingOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); color: white; font-size: 20px; display: flex; align-items: center; justify-content: center; z-index: 2000;">
         Loading audio...
     </div>

     <script type="module" src="app.js"></script>
</body>
</html>
